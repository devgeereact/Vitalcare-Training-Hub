name: CI

# Enforces RULE 17 (no merge without typecheck + lint + build) and adds a
# credential gate. Hardened to match the convention already running in rotaflow
# and kokolett-beauty.
#
# CodeQL runs as its own workflow, see .github/workflows/codeql.yml. This note
# used to say the repo was private and so could not run CodeQL without GitHub
# Advanced Security; the repo is public, so the scan is free and now enabled.
# Dependabot covers dependencies, see .github/dependabot.yml.

on:
  push:
    branches: [dev, production]
  pull_request:
    branches: [dev, production]

# Least privilege. Without this block GITHUB_TOKEN gets the repository default,
# which is far broader than checkout needs.
permissions:
  contents: read

# A superseded run on the same ref is wasted minutes and a confusing red X on a
# commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Not the author's zone. This platform schedules sessions, issues
    # certificates with expiry dates and runs attendance windows, all of which
    # are date arithmetic that behaves differently under UTC than under BST.
    # Pinning UTC means CI never shares the developer's zone and cannot hide
    # that class of bug.
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN on disk for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # First, and on every push. A committed key is the one failure a later job
      # cannot undo: once it is on the remote it exists in every clone and must
      # be rotated, not deleted.
      - name: Secret scan
        run: npm run check:secrets

      # Unit tests before the build: they are the fastest signal, and a failure
      # here means the logic is wrong regardless of whether it bundles.
      - name: Unit tests
        run: npm run test

      # `npm run build` runs tsc first, but run it separately so a type error is
      # reported as a type error rather than buried in a failed bundle.
      - name: Typecheck
        run: npm run typecheck

      # Not --max-warnings 0 yet. The two standing warnings are in files this
      # project may not edit: a React Compiler notice on TanStack Table's
      # useReactTable, and an unused `ref` in src/components/ui/sidebar.tsx,
      # which is Shadcn and off-limits per CLAUDE.md. Tighten this when both are
      # resolved upstream rather than by editing generated components.
      - name: Lint
        run: npm run lint

      # No VITE_* secrets are provided here on purpose. The build must succeed
      # without them: src/lib/supabase/client.ts falls back to the publishable
      # key, which is browser-safe. If a build ever starts REQUIRING a secret,
      # that secret is about to be baked into the bundle and shipped publicly.
      - name: Build
        run: npm run build

  # End-to-end against the production build: deep links, per-page metadata,
  # WCAG AA, the mobile safe area at five widths, and the bundle budget. Kept as
  # its own job so a failure here is legible as "the built site is wrong" rather
  # than folded into the lint step.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: verify
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The sitemap generator reaches for the database and warns rather than
      # failing when it cannot, so the build works here without credentials.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The authorisation suite signs in as real accounts against the live Supabase
  # project, so it only runs where those credentials exist. It is deliberately
  # not required for a merge from a fork, which cannot hold them: it runs on
  # pushes to the long-lived branches, where the secrets are available.
  authorisation:
    name: authorisation
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    env:
      TZ: UTC
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPER_ADMIN_EMAIL: ${{ secrets.TEST_SUPER_ADMIN_EMAIL }}
      TEST_SUPER_ADMIN_PASSWORD: ${{ secrets.TEST_SUPER_ADMIN_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_TRAINER_EMAIL: ${{ secrets.TEST_TRAINER_EMAIL }}
      TEST_TRAINER_PASSWORD: ${{ secrets.TEST_TRAINER_PASSWORD }}
      TEST_LEARNER_EMAIL: ${{ secrets.TEST_LEARNER_EMAIL }}
      TEST_LEARNER_PASSWORD: ${{ secrets.TEST_LEARNER_PASSWORD }}
      TEST_OTHER_USER_EMAIL: ${{ secrets.TEST_OTHER_USER_EMAIL }}
      TEST_OTHER_USER_PASSWORD: ${{ secrets.TEST_OTHER_USER_PASSWORD }}
      MIGRATION_092_APPLIED: ${{ vars.MIGRATION_092_APPLIED }}
      MIGRATION_093_APPLIED: ${{ vars.MIGRATION_093_APPLIED }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # A job that skipped every test and reported success is exactly the
      # failure this suite exists to prevent, so refuse to be green without
      # the credentials rather than quietly proving nothing.
      - name: Require credentials
        run: |
          missing=0
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY \
                   TEST_SUPER_ADMIN_EMAIL TEST_SUPER_ADMIN_PASSWORD \
                   TEST_ADMIN_EMAIL TEST_ADMIN_PASSWORD \
                   TEST_TRAINER_EMAIL TEST_TRAINER_PASSWORD \
                   TEST_LEARNER_EMAIL TEST_LEARNER_PASSWORD \
                   TEST_OTHER_USER_EMAIL TEST_OTHER_USER_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::The authorisation suite cannot run. Configure the"
            echo "::error::repository secrets listed in tests/security/.env.example."
            exit 1
          fi
          for v in MIGRATION_092_APPLIED MIGRATION_093_APPLIED; do
            if [ "${!v}" != "1" ]; then
              echo "::warning::$v is not 1, so its assertions will be skipped."
            fi
          done

      - name: Authorisation and journey tests
        run: npm run test:security
